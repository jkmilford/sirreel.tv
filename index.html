<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SirReel.tv</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
        }
        
        .container {
            max-width: 680px;
            padding: 40px 20px;
        }
        
        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 4.8rem;
            font-weight: 700;
            letter-spacing: -3px;
            margin-bottom: 8px;
        }
        
        .subtitle {
            font-size: 1.35rem;
            color: #aaaaaa;
            margin-bottom: 60px;
            font-weight: 400;
        }
        
        h1 {
            font-size: 3.4rem;
            line-height: 1.15;
            font-weight: 600;
            margin-bottom: 24px;
        }
        
        p {
            font-size: 1.25rem;
            color: #bbbbbb;
            max-width: 520px;
            margin: 0 auto 60px;
        }
        
        .coming-soon {
            display: inline-block;
            font-size: 1rem;
            letter-spacing: 3px;
            padding: 10px 28px;
            border: 1px solid #333;
            border-radius: 50px;
            margin-bottom: 50px;
        }
        
        .email-form {
            max-width: 420px;
            margin: 0 auto;
        }
        
        input {
            width: 100%;
            padding: 20px 24px;
            background: #111111;
            border: 1px solid #333;
            border-radius: 16px;
            color: white;
            font-size: 1.1rem;
            margin-bottom: 12px;
            outline: none;
            transition: all 0.3s;
        }
        
        input:focus {
            border-color: #ffffff;
        }
        
        button {
            width: 100%;
            padding: 18px;
            background: white;
            color: black;
            font-weight: 600;
            font-size: 1.1rem;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #ddd;
            transform: translateY(-2px);
        }
        
        footer {
            position: absolute;
            bottom: 40px;
            width: 100%;
            font-size: 0.95rem;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">SIRREEL</div>
        <div class="subtitle">.tv</div>
        
        <div class="coming-soon">COMING SOON</div>
        
        <h1>Surreal motion.<br>Beautifully strange stories.</h1>
        
        <p>
            Short-form video reimagined. 
            Where motion design meets surreal storytelling.
        </p>
        
        <div class="email-form">
            <input type="email" id="email" placeholder="your@email.com" />
            <button onclick="subscribe()">Notify Me</button>
            <div id="success" style="margin-top: 20px; color: #00ff9d; display: none; font-weight: 500;">
                ✓ You're on the list.
            </div>
        </div>
    </div>

    <footer>
        SirReel.tv © 2026
    </footer>

    <script>
        function subscribe() {
            const email = document.getElementById('email');
            const success = document.getElementById('success');
            if (email.value.trim() !== '') {
                success.style.display = 'block';
                email.value = '';
            }
        }
    </script>
</body>
</html>
